name: Merge tested updates

on:
  workflow_run:
    workflows: ["Test manifests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/tunlease-')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the tested Tunlease update
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open update PR for $BRANCH"
            exit 0
          fi
          gh pr merge "$pr" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch
