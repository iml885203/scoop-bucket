name: Test manifests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test update security boundary
        run: python3 .github/scripts/test-update-workflow.py

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate JSON
        shell: pwsh
        run: |
          python .github/scripts/semver-not-older.py --self-test
          Get-ChildItem bucket/*.json | ForEach-Object { Get-Content $_ | ConvertFrom-Json | Out-Null }
      - name: Install with Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/bucket/tunlease.json"
          scoop install "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/bucket/orbit.json"
          Join-Path $HOME "scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test command and completion
        shell: pwsh
        run: |
          tul --version
          tul completion powershell | Select-Object -First 1
          $expected = (Get-Content bucket/orbit.json | ConvertFrom-Json).version
          $actual = orbit --version
          if ($actual -notmatch "^v$([regex]::Escape($expected))(?:\s|$)") {
            throw "Orbit version '$actual' does not match manifest $expected"
          }
